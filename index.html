<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="orb" id="orb"></div>
    <h1>My AI Assistant</h1>
    <p id="status">Tap the microphone and speak</p>

    <div class="chat" id="chat">
      <div class="message ai">Hello! I am ready. Say “hello”, “time”, or “open YouTube”.</div>
    </div>

    <div class="controls">
      <button id="micBtn" aria-label="Start voice input">🎙️</button>
      <input id="textInput" type="text" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>
  </main>
  <script src="input.js"></script>
  <script src="render.js"></script>
</body>
</html>
